[project]
name = "infraagent"
version = "0.1.0"
description = "AI-powered multi-agent IaC generation pipeline built on Azure AI Foundry"
requires-python = ">=3.12"
dependencies = [
    # Azure AI Foundry + Agent Framework
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.19.0",
    "openai>=1.0.0",
    "agent-framework",
    # Azure Management (subscription discovery)
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-network>=25.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5",
    # Async & Database
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]
