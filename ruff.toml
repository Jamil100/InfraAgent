[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "ANN",    # flake8-annotations
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
]
lint.ignore = [
    "ANN101",  # missing-type-self (use Self instead)
    "ANN102",  # missing-type-cls (use cls annotations)
    "E501",    # line-too-long (handled by formatter)
]

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    "migrations",
    "generated",
]
